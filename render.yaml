services:
  - type: web
    name: chart-viewer-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      # Render ignored backend/runtime.txt and built on Python 3.14 — a version
      # this codebase has never been tested against, while local dev and the
      # test suite run 3.9. PYTHON_VERSION is the setting Render actually reads,
      # so the pin lives here where a deploy cannot quietly drift off it.
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: chart-viewer-db
          property: connectionString
      - key: STORAGE_ENDPOINT_URL
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: STORAGE_BUCKET_NAME
        sync: false
      - key: STORAGE_PUBLIC_URL
        sync: false
      - key: MASTER_ADMIN_PASSPHRASE
        sync: false
      - key: CORS_ORIGINS
        value: https://chart-viewer-ui.onrender.com

  - type: web
    name: chart-viewer-ui
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist

databases:
  - name: chart-viewer-db
    databaseName: chartviewer
    plan: free
