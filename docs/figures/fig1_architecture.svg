<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720">
  <style>
    .ttl   { font-family: Helvetica, Arial, sans-serif; font-size: 21px; font-weight: bold; fill: #1F3864; }
    .sub   { font-family: Helvetica, Arial, sans-serif; font-size: 14px; fill: #595959; }
    .box   { font-family: Helvetica, Arial, sans-serif; font-size: 17px; font-weight: bold; }
    .small { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #404040; }
    .tiny  { font-family: Helvetica, Arial, sans-serif; font-size: 12px; fill: #595959; }
    .lbl   { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #1F3864; font-weight: bold; }
    .no    { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #B23A33; font-weight: bold; }
    .zone  { font-family: Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; letter-spacing: 1px; }
  </style>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2E75B6"/>
    </marker>
    <marker id="arG" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#7F7F7F"/>
    </marker>
  </defs>

  <rect width="1240" height="720" fill="#FFFFFF"/>

  <!-- zones -->
  <rect x="24" y="80"  width="250" height="600" rx="10" fill="#FAFAFA" stroke="#D9D9D9" stroke-dasharray="5,4"/>
  <text x="149" y="106" class="zone" text-anchor="middle" style="fill:#8C8C8C">USER DEVICE</text>

  <rect x="300" y="80" width="560" height="600" rx="10" fill="#F4F8FC" stroke="#BBD3EA" stroke-dasharray="5,4"/>
  <text x="580" y="106" class="zone" text-anchor="middle" style="fill:#2E75B6">APPLICATION PLATFORM</text>

  <rect x="890" y="80" width="326" height="600" rx="10" fill="#FDF7EE" stroke="#E8C99A" stroke-dasharray="5,4"/>
  <text x="1053" y="106" class="zone" text-anchor="middle" style="fill:#A9762A">DATA STORES</text>

  <!-- title -->
  <text x="24" y="38" class="ttl">Figure 1 — System architecture</text>
  <text x="24" y="62" class="sub">Four components. Two run code; two hold data. Only the backend reaches the data stores.</text>

  <!-- browser -->
  <rect x="52" y="290" width="194" height="120" rx="10" fill="#FFFFFF" stroke="#595959" stroke-width="2"/>
  <text x="149" y="330" class="box" text-anchor="middle" style="fill:#333333">Web browser</text>
  <text x="149" y="354" class="small" text-anchor="middle">Trainer or coder</text>
  <text x="149" y="378" class="tiny" text-anchor="middle">Holds no credentials</text>

  <!-- frontend -->
  <rect x="330" y="160" width="230" height="130" rx="10" fill="#FFFFFF" stroke="#2E75B6" stroke-width="2.5"/>
  <text x="445" y="196" class="box" text-anchor="middle" style="fill:#1F3864">Front end</text>
  <text x="445" y="220" class="small" text-anchor="middle">React static site</text>
  <text x="445" y="242" class="tiny" text-anchor="middle">HTML / JS / CSS only</text>
  <text x="445" y="262" class="tiny" text-anchor="middle">Stores nothing</text>

  <!-- backend -->
  <rect x="330" y="400" width="230" height="180" rx="10" fill="#1F3864" stroke="#1F3864" stroke-width="2.5"/>
  <text x="445" y="440" class="box" text-anchor="middle" style="fill:#FFFFFF">Backend API</text>
  <text x="445" y="464" class="small" text-anchor="middle" style="fill:#FFFFFF">FastAPI · Python 3.11</text>
  <text x="445" y="492" class="tiny" text-anchor="middle" style="fill:#FFFFFF">Grading engine</text>
  <text x="445" y="512" class="tiny" text-anchor="middle" style="fill:#FFFFFF">Chart ingest and conversion</text>
  <text x="445" y="532" class="tiny" text-anchor="middle" style="fill:#FFFFFF">Answer-key parsing</text>
  <text x="445" y="552" class="tiny" text-anchor="middle" style="fill:#FFFFFF">Analytics and reports</text>

  <!-- credentials note -->
  <rect x="600" y="160" width="238" height="130" rx="8" fill="#FFFFFF" stroke="#BFBFBF" stroke-dasharray="4,3"/>
  <text x="719" y="188" class="lbl" text-anchor="middle">Credentials live here only</text>
  <text x="719" y="214" class="tiny" text-anchor="middle">DATABASE_URL</text>
  <text x="719" y="234" class="tiny" text-anchor="middle">STORAGE_ACCESS_KEY</text>
  <text x="719" y="254" class="tiny" text-anchor="middle">STORAGE_SECRET_KEY</text>
  <text x="719" y="274" class="tiny" text-anchor="middle">MASTER_ADMIN_PASSPHRASE</text>

  <!-- database -->
  <rect x="920" y="180" width="266" height="150" rx="10" fill="#FFFFFF" stroke="#A9762A" stroke-width="2.5"/>
  <text x="1053" y="216" class="box" text-anchor="middle" style="fill:#8A5A00">PostgreSQL</text>
  <text x="1053" y="240" class="small" text-anchor="middle">32 tables</text>
  <text x="1053" y="266" class="tiny" text-anchor="middle">Charts metadata · answer keys</text>
  <text x="1053" y="286" class="tiny" text-anchor="middle">batches · results · assessments</text>
  <text x="1053" y="310" class="tiny" text-anchor="middle" style="fill:#B23A33">No binary content</text>

  <!-- object storage -->
  <rect x="920" y="420" width="266" height="150" rx="10" fill="#FFFFFF" stroke="#A9762A" stroke-width="2.5"/>
  <text x="1053" y="456" class="box" text-anchor="middle" style="fill:#8A5A00">Object storage</text>
  <text x="1053" y="480" class="small" text-anchor="middle">S3-compatible bucket</text>
  <text x="1053" y="506" class="tiny" text-anchor="middle">Chart page images (PNG)</text>
  <text x="1053" y="528" class="tiny" text-anchor="middle" style="fill:#B23A33">The only copy — not in any</text>
  <text x="1053" y="546" class="tiny" text-anchor="middle" style="fill:#B23A33">database backup</text>

  <!-- arrows -->
  <line x1="248" y1="316" x2="326" y2="248" stroke="#7F7F7F" stroke-width="2" marker-end="url(#arG)"/>
  <text x="288" y="296" class="tiny" text-anchor="middle">loads the app</text>

  <line x1="246" y1="372" x2="326" y2="462" stroke="#2E75B6" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="238" y="432" class="lbl">every request</text>
  <text x="238" y="450" class="tiny">data AND chart images</text>


  <line x1="562" y1="440" x2="916" y2="316" stroke="#2E75B6" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="742" y="360" class="lbl" text-anchor="middle">SQL</text>

  <line x1="562" y1="510" x2="916" y2="496" stroke="#2E75B6" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="740" y="546" class="lbl" text-anchor="middle">S3 API — put / get / delete</text>

  <!-- the route that does NOT exist -->
  <path d="M 150 412 L 150 618 L 1053 618 L 1053 576" fill="none" stroke="#B23A33" stroke-width="2" stroke-dasharray="7,5"/>
  <g>
    <circle cx="600" cy="618" r="19" fill="#FFFFFF" stroke="#B23A33" stroke-width="2.5"/>
    <line x1="588" y1="606" x2="612" y2="630" stroke="#B23A33" stroke-width="3.5"/>
    <line x1="612" y1="606" x2="588" y2="630" stroke="#B23A33" stroke-width="3.5"/>
  </g>
  <text x="600" y="662" class="no" text-anchor="middle">This path does not exist — the browser never contacts storage.</text>
  <text x="600" y="680" class="tiny" text-anchor="middle">No CORS, no public bucket, no credentials in the browser.</text>
</svg>
