<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880">
  <style>
    .ttl{font-family:Helvetica,Arial;font-size:30px;font-weight:bold;fill:#1F3864}
    .sub{font-family:Helvetica,Arial;font-size:20px;fill:#595959}
    .stepn{font-family:Helvetica,Arial;font-size:17.5px;font-weight:bold;fill:#FFFFFF}
    .stept{font-family:Helvetica,Arial;font-size:20px;font-weight:bold;fill:#1F3864}
    .stepd{font-family:Helvetica,Arial;font-size:17.5px;fill:#404040}
    .tbl{font-family:Consolas,monospace;font-size:17px;fill:#C0392B}
    .tblh{font-family:Helvetica,Arial;font-size:14px;font-weight:bold;letter-spacing:1px;fill:#8C8C8C}
    .who{font-family:Helvetica,Arial;font-size:14px;font-weight:bold;letter-spacing:1px}
    .note{font-family:Helvetica,Arial;font-size:17.5px;fill:#595959}
  </style>
  <defs>
    <marker id="w2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#C0392B"/>
    </marker>
  </defs>
  <rect width="1240" height="880" fill="#FFFFFF"/>
  <text x="24" y="36" class="ttl">Figure E — Assessment workflow: from question bank to result</text>
  <text x="24" y="60" class="sub">The multiple-choice path. Independent of charts and of PracticeLab.</text>

  <rect x="24" y="86" width="700" height="26" rx="4" fill="#FDEDEC"/>
  <text x="40" y="104" class="who" fill="#922B21">TRAINER AND CODER ACTIONS</text>
  <rect x="740" y="86" width="476" height="26" rx="4" fill="#F5F5F5"/>
  <text x="756" y="104" class="tblh">TABLES WRITTEN</text>

  <g>
    <circle cx="56" cy="150" r="16" fill="#C0392B"/><text x="56" y="155" class="stepn" text-anchor="middle">1</text>
    <text x="88" y="146" class="stept">Trainer uploads questions to the bank</text>
    <text x="88" y="168" class="stepd">An Excel workbook, parsed and validated on upload. The workbook is not kept.</text>
    <text x="756" y="146" class="tbl">assessment_questions</text>
  </g>
  <line x1="56" y1="176" x2="56" y2="212" stroke="#C0392B" stroke-width="2" marker-end="url(#w2)"/>

  <g>
    <circle cx="56" cy="240" r="16" fill="#C0392B"/><text x="56" y="245" class="stepn" text-anchor="middle">2</text>
    <text x="88" y="236" class="stept">Trainer generates a paper</text>
    <text x="88" y="258" class="stepd">Chooses the specialty mix, question count, pass mark and coder list. Each coder</text>
    <text x="88" y="278" class="stepd">gets their own question set, with options shuffled individually.</text>
    <text x="756" y="236" class="tbl">generated_assessments</text>
    <text x="756" y="258" class="tbl">generated_assessment_students</text>
    <text x="756" y="280" class="tbl">assessment_sessions</text>
  </g>
  <line x1="56" y1="292" x2="56" y2="328" stroke="#C0392B" stroke-width="2" marker-end="url(#w2)"/>

  <g>
    <circle cx="56" cy="356" r="16" fill="#C0392B"/><text x="56" y="361" class="stepn" text-anchor="middle">3</text>
    <text x="88" y="352" class="stept">Coder enters their token and starts</text>
    <text x="88" y="374" class="stepd">The countdown begins on the first question. The token is valid for eight hours</text>
    <text x="88" y="394" class="stepd">from generation; a session never started simply lapses.</text>
    <text x="756" y="352" class="tbl">assessment_sessions.status</text>
  </g>
  <line x1="56" y1="408" x2="56" y2="444" stroke="#C0392B" stroke-width="2" marker-end="url(#w2)"/>

  <g>
    <circle cx="56" cy="472" r="16" fill="#C0392B"/><text x="56" y="477" class="stepn" text-anchor="middle">4</text>
    <text x="88" y="468" class="stept">Coder answers — each answer saved as it is given</text>
    <text x="88" y="490" class="stepd">Answers can be changed until submission. Correctness is evaluated per answer</text>
    <text x="88" y="510" class="stepd">against that coder's own frozen question set.</text>
    <text x="756" y="468" class="tbl">assessment_responses</text>
  </g>
  <line x1="56" y1="524" x2="56" y2="560" stroke="#C0392B" stroke-width="2" marker-end="url(#w2)"/>

  <g>
    <circle cx="56" cy="588" r="16" fill="#C0392B"/><text x="56" y="593" class="stepn" text-anchor="middle">5</text>
    <text x="88" y="584" class="stept">Submission — by the coder, or by the clock</text>
    <text x="88" y="606" class="stepd">The score is computed once, at submission. A session whose time runs out is</text>
    <text x="88" y="626" class="stepd">scored and closed on the next request that touches it, marked auto-submitted.</text>
    <text x="756" y="584" class="tbl">assessment_results</text>
  </g>
  <line x1="56" y1="640" x2="56" y2="676" stroke="#C0392B" stroke-width="2" marker-end="url(#w2)"/>

  <g>
    <circle cx="56" cy="704" r="16" fill="#C0392B"/><text x="56" y="709" class="stepn" text-anchor="middle">6</text>
    <text x="88" y="700" class="stept">Trainer reviews, and may correct a graded answer</text>
    <text x="88" y="722" class="stepd">A correction requires a written justification, is recorded alongside the original</text>
    <text x="88" y="742" class="stepd">verdict rather than replacing it, and rescores the session immediately.</text>
    <text x="756" y="700" class="tbl">assessment_responses.override_*</text>
    <text x="756" y="722" class="tbl">assessment_results</text>
    <text x="756" y="744" class="tbl">assessment_audit_log</text>
  </g>

  <rect x="24" y="786" width="1192" height="76" rx="6" fill="#FDEDEC" stroke="#C0392B"/>
  <text x="46" y="814" class="note" fill="#922B21">Questions are frozen into each coder's row at step 2. Editing or retiring a question afterwards cannot change a paper already sat,</text>
  <text x="46" y="838" class="note" fill="#922B21">and cannot change how an answer already given was scored.</text>
</svg>
