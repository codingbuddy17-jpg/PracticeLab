<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640">
  <style>
    .ttl   { font-family: Helvetica, Arial, sans-serif; font-size: 21px; font-weight: bold; fill: #1F3864; }
    .sub   { font-family: Helvetica, Arial, sans-serif; font-size: 14px; fill: #595959; }
    .box   { font-family: Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; }
    .small { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #404040; }
    .tiny  { font-family: Helvetica, Arial, sans-serif; font-size: 12px; fill: #595959; }
    .mono  { font-family: Consolas, "Courier New", monospace; font-size: 12px; fill: #7B1FA2; }
    .lbl   { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #1F3864; font-weight: bold; }
    .no    { font-family: Helvetica, Arial, sans-serif; font-size: 13px; fill: #B23A33; font-weight: bold; }
    .phase { font-family: Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; letter-spacing: 1px; fill: #8C8C8C; }
  </style>
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2E75B6"/>
    </marker>
    <marker id="a2r" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#B23A33"/>
    </marker>
  </defs>
  <rect width="1240" height="640" fill="#FFFFFF"/>

  <text x="24" y="34" class="ttl">Figure 2 — What happens to an uploaded chart</text>
  <text x="24" y="58" class="sub">The uploaded file is converted and discarded. The page images become the chart.</text>

  <text x="24" y="98" class="phase">UPLOAD</text>
  <line x1="24" y1="108" x2="1216" y2="108" stroke="#E5E5E5"/>

  <!-- source file -->
  <rect x="30" y="130" width="180" height="96" rx="8" fill="#FFFFFF" stroke="#595959" stroke-width="2"/>
  <text x="120" y="162" class="box" text-anchor="middle" fill="#333">Trainer uploads</text>
  <text x="120" y="186" class="small" text-anchor="middle">PDF · image · DOCX</text>
  <text x="120" y="208" class="tiny" text-anchor="middle">e.g. Discharge Summary.pdf</text>

  <line x1="212" y1="178" x2="292" y2="178" stroke="#2E75B6" stroke-width="2.5" marker-end="url(#a2)"/>

  <!-- converter -->
  <rect x="296" y="130" width="200" height="96" rx="8" fill="#1F3864" stroke="#1F3864"/>
  <text x="396" y="162" class="box" text-anchor="middle" style="fill:#FFFFFF">Backend converts</text>
  <text x="396" y="186" class="small" text-anchor="middle" style="fill:#FFFFFF">one PNG per page</text>
  <text x="396" y="208" class="tiny" text-anchor="middle" style="fill:#FFFFFF">plus text extraction</text>

  <!-- discarded -->
  <rect x="296" y="250" width="200" height="62" rx="8" fill="#FDECEA" stroke="#B23A33" stroke-dasharray="5,4"/>
  <text x="396" y="276" class="no" text-anchor="middle">Original file discarded</text>
  <text x="396" y="298" class="tiny" text-anchor="middle" style="fill:#B23A33">no archive anywhere</text>
  <line x1="396" y1="228" x2="396" y2="246" stroke="#B23A33" stroke-width="2" marker-end="url(#a2r)"/>

  <!-- split to two stores -->
  <line x1="498" y1="160" x2="640" y2="160" stroke="#2E75B6" stroke-width="2.5" marker-end="url(#a2)"/>
  <line x1="498" y1="196" x2="640" y2="300" stroke="#2E75B6" stroke-width="2.5" marker-end="url(#a2)"/>

  <!-- postgres row -->
  <rect x="646" y="126" width="560" height="112" rx="8" fill="#FFFFFF" stroke="#A9762A" stroke-width="2"/>
  <text x="666" y="152" class="box" style="fill:#8A5A00">PostgreSQL</text>
  <text x="666" y="176" class="small">chart_files — one row per page</text>
  <text x="666" y="200" class="mono">storage_key   charts/142/0000_Discharge Summary.pdf.png</text>
  <text x="666" y="220" class="mono">page_order · page_text · original_filename</text>

  <!-- storage row -->
  <rect x="646" y="262" width="560" height="112" rx="8" fill="#FFFFFF" stroke="#A9762A" stroke-width="2"/>
  <text x="666" y="288" class="box" style="fill:#8A5A00">Object storage</text>
  <text x="666" y="312" class="small">The page images themselves</text>
  <text x="666" y="336" class="mono">charts/142/0000_Discharge Summary.pdf.png</text>
  <text x="666" y="356" class="mono">charts/142/0001_Discharge Summary.pdf.png</text>

  <!-- linkage -->
  <line x1="926" y1="240" x2="926" y2="260" stroke="#8A5A00" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="940" y="256" class="tiny" style="fill:#8A5A00">the key is the only link between the two</text>

  <text x="24" y="424" class="phase">VIEWING</text>
  <line x1="24" y1="434" x2="1216" y2="434" stroke="#E5E5E5"/>

  <!-- viewing flow -->
  <rect x="30" y="456" width="180" height="76" rx="8" fill="#FFFFFF" stroke="#595959" stroke-width="2"/>
  <text x="120" y="484" class="box" text-anchor="middle" fill="#333">Browser</text>
  <text x="120" y="508" class="mono" text-anchor="middle">GET /charts/142/page/0</text>

  <line x1="212" y1="494" x2="292" y2="494" stroke="#2E75B6" stroke-width="2.5" marker-end="url(#a2)"/>

  <rect x="296" y="456" width="200" height="76" rx="8" fill="#1F3864" stroke="#1F3864"/>
  <text x="396" y="484" class="box" text-anchor="middle" style="fill:#FFFFFF">Backend API</text>
  <text x="396" y="506" class="tiny" text-anchor="middle" style="fill:#FFFFFF">reads storage_key, fetches</text>

  <line x1="498" y1="494" x2="640" y2="494" stroke="#2E75B6" stroke-width="2.5" marker-end="url(#a2)"/>

  <rect x="646" y="456" width="230" height="76" rx="8" fill="#FFFFFF" stroke="#A9762A" stroke-width="2"/>
  <text x="761" y="484" class="box" text-anchor="middle" style="fill:#8A5A00">Object storage</text>
  <text x="761" y="506" class="tiny" text-anchor="middle">returns the bytes</text>

  <path d="M 646 524 Q 560 578 400 578 Q 260 578 160 540" fill="none" stroke="#2E75B6" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#a2)"/>
  <text x="400" y="600" class="lbl" text-anchor="middle">streamed back through the API — the browser never sees a storage URL</text>
</svg>
